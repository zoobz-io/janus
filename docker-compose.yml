# Shared application environment. Infra wiring lives here; per-service overrides
# (ports) are set on each service. Secrets/auth can be supplied via a local .env.
x-app-env: &app-env
  APP_DB_HOST: postgres
  APP_DB_PORT: "5432"
  APP_DB_NAME: janus
  APP_DB_USER: janus
  APP_DB_PASSWORD: janus
  APP_DB_SSLMODE: disable
  APP_REDIS_ADDR: redis:6379
  APP_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

# Shared build for the hot-reload app containers.
x-app-build: &app-build
  context: .
  dockerfile: tools/dev/Dockerfile.dev

# Shared dependency set for the app containers.
x-app-deps: &app-deps
  postgres:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully
  redis:
    condition: service_healthy

services:
  # =============================================================================
  # Core Infrastructure (started by any app profile, not by observability alone)
  # =============================================================================

  postgres:
    profiles: ["api", "admin"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: janus
      POSTGRES_USER: janus
      POSTGRES_PASSWORD: janus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U janus"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    profiles: ["api", "admin"]
    image: ghcr.io/kukymbr/goose-docker:latest
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: "host=postgres port=5432 user=janus password=janus dbname=janus sslmode=disable"
      GOOSE_MIGRATION_DIR: /migrations

  redis:
    profiles: ["api", "admin"]
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =============================================================================
  # Applications (one profile each — start only what you need)
  # =============================================================================

  api:
    profiles: ["api"]
    build: *app-build
    command: ["air", "-c", "tools/dev/air.api.toml"]
    depends_on: *app-deps
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
      APP_PORT: "8080"
      OTEL_SERVICE_NAME: janus-api
    ports:
      - "8080:8080"
    volumes:
      - .:/app

  admin:
    profiles: ["admin"]
    build: *app-build
    command: ["air", "-c", "tools/dev/air.admin.toml"]
    depends_on: *app-deps
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
      APP_ADMIN_PORT: "8081"
      OTEL_SERVICE_NAME: janus-admin
    ports:
      - "8081:8081"
    volumes:
      - .:/app

  # =============================================================================
  # Observability Stack (optional — `--profile observability`)
  # =============================================================================

  jaeger:
    profiles: ["observability"]
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"

  loki:
    profiles: ["observability"]
    image: grafana/loki:latest
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - lokidata:/loki

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:latest
    volumes:
      - ./tools/dev/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    ports:
      - "9091:9090"

  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:latest
    volumes:
      - ./tools/dev/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4318:4318"
    depends_on:
      - jaeger
      - loki
      - prometheus

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "3000:3000"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./tools/dev/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
      - jaeger

volumes:
  pgdata:
  redisdata:
  lokidata:
  prometheusdata:
  grafanadata:
