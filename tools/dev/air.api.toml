# Air hot-reload config for the public API (cmd/api).
root = "."
tmp_dir = "tmp-api"

[build]
  bin = "./tmp-api/main"
  cmd = "go build -o ./tmp-api/main ./cmd/api"
  delay = 1000
  exclude_dir = ["assets", "tmp", "tmp-api", "tmp-admin", "vendor", "docker", "migrations"]
  exclude_regex = ["_test.go"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  kill_delay = "2s"
  log = "build-errors-api.log"
  stop_on_error = true

[color]
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = false

[misc]
  clean_on_exit = true
